name: crawl

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - run: python -m crawler.run --seeds seeds.txt --out data
      - name: Commit if content changed
        run: |
          git config user.name 'trustlayer-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data
          git diff --cached --quiet || (git commit -m 'chore(data): update index' && git push)
