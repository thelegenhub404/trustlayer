name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Validate test vectors
        run: python -m tests.vectors
      - name: Verify new seed domains
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          NEW=$(git diff origin/${{ github.base_ref }}...HEAD -- seeds.txt \
            | grep '^+[^+]' | sed 's/^+//' | grep -v '^$' | grep -v '^#' || true)
          for d in $NEW; do
            echo "verifying $d"
            tl verify "$d"
          done
